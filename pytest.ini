[pytest]
testpaths = tests
pythonpath = backend
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
    ignore::sqlalchemy.exc.MovedIn20Warning
markers =
    security: security, isolation and governance assertions
    regression: guards previously working MO behaviour
    builder: Universal Builder Runtime
    slow: takes more than a few seconds
    voice: JARVIS voice conversation layer
